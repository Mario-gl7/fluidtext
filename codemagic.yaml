workflows:
  ios-linguareader:
    name: iOS LinguaReader
    environment:
      vars:
        PONS_API_KEY:
          value: $PONS_API_KEY
          is_secure: true

    scripts:
      - name: Install dependencies
        script: |
          echo "No extra dependencies for pure SwiftUI project"
      - name: Build iOS
        script: |
          xcodebuild -workspace ios/LinguaReader.xcworkspace \
                     -scheme LinguaReaderApp \
                     -sdk iphoneos \
                     -configuration Release clean build
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          xcodebuild -exportArchive \
                     -archivePath build/LinguaReaderApp.xcarchive \
                     -exportOptionsPlist ios/ExportOptions.plist \
                     -exportPath build/ipa
artifacts:
  - build/ipa/*.ipa
